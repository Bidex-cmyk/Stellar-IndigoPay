version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_indigopay_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stellar_indigopay_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: indigopay-backend-test:ci
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stellar_indigopay_test
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: testnet
      HORIZON_URL: https://horizon-testnet.stellar.org
      ALLOWED_ORIGINS: http://localhost:3000
      SKIP_INTEGRATION: "1"
      # The OpenAPI drift test requires repo-root scripts/validate-openapi.js,
      # which resolves js-yaml from the backend image's node_modules. NODE_PATH
      # lets that mounted module find /app/node_modules (see volumes below).
      NODE_PATH: /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # backend/__tests__/scripts/openapi-drift.test.js reaches the repo root
      # via ../../../scripts/... and scripts/validate-openapi.js resolves
      # SPEC_PATH (docs/api/openapi.yaml) and BACKEND_SRC_DIR (backend/src)
      # relative to that mounted location. The backend image is built from
      # backend/ only, so bind-mount the repo-root files it needs.
      - ./scripts:/scripts:ro
      - ./docs:/docs:ro
      - ./backend/src:/backend/src:ro
    command: npm test
